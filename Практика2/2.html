<!doctype html><html><head><style type="text/css">* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: white;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    max-width: 600px;
    width: 100%;
}

h1 {
    text-align: center;
    color: #333;
    margin-bottom: 40px;
    font-size: 2.5em;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.toggle-section {
    margin-bottom: 40px;
    padding: 20px;
    background: #f8f9fa;
    border-radius: 15px;
    border-left: 5px solid #667eea;
}

.toggle-section h2 {
    color: #495057;
    margin-bottom: 20px;
    font-size: 1.4em;
}

.toggle-switch {
    position: relative;
    display: inline-block;
    width: 80px;
    height: 40px;
    cursor: pointer;
}

.toggle-input {
    opacity: 0;
    width: 0;
    height: 0;
}

.toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, #dc3545 0%, #fd7e14 100%);
    transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    border-radius: 34px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

.toggle-slider:before {
    content: "";
    position: absolute;
    height: 32px;
    width: 32px;
    left: 4px;
    bottom: 4px;
    background: white;
    transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    border-radius: 50%;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

.toggle-input:checked + .toggle-slider {
    background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
}

.toggle-input:checked + .toggle-slider:before {
    transform: translateX(40px);
}

.toggle-input:focus + .toggle-slider {
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
}

.toggle-input:active + .toggle-slider:before {
    width: 36px;
}

.toggle-input:checked:active + .toggle-slider:before {
    transform: translateX(36px);
}
.toggle-labels {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 12px;
    font-size: 12px;
    font-weight: 600;
    color: white;
    pointer-events: none;
}

.toggle-off {
    opacity: 1;
    transition: opacity 0.3s ease;
}

.toggle-on {
    opacity: 0;
    transition: opacity 0.3s ease;
}

.toggle-input:checked ~ .toggle-labels .toggle-off {
    opacity: 0;
}

.toggle-input:checked ~ .toggle-labels .toggle-on {
    opacity: 1;
}

.icon-toggle .toggle-slider {
    background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
}

.icon-toggle .toggle-input:checked + .toggle-slider {
    background: linear-gradient(135deg, #ffc107 0%, #fd7e14 100%);
}

.toggle-icon {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    transition: opacity 0.3s ease;
    pointer-events: none;
}

.toggle-icon:first-child {
    left: 12px;
    opacity: 1;
}

.toggle-icon:last-child {
    right: 12px;
    opacity: 0;
}

.toggle-input:checked + .toggle-slider .toggle-icon:first-child {
    opacity: 0;
}

.toggle-input:checked + .toggle-slider .toggle-icon:last-child {
    opacity: 1;
}

.text-toggle {
    width: 100px;
}

.text-toggle .toggle-slider {
    background: linear-gradient(135deg, #dc3545 0%, #ff6b6b 100%);
}

.text-toggle .toggle-input:checked + .toggle-slider {
    background: linear-gradient(135deg, #28a745 0%, #38d39f 100%);
}

.toggle-text {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    font-weight: 600;
    color: white;
    transition: opacity 0.3s ease;
    pointer-events: none;
}

.toggle-text:first-child {
    left: 12px;
    opacity: 1;
}

.toggle-text:last-child {
    right: 12px;
    opacity: 0;
}

.toggle-input:checked + .toggle-slider .toggle-text:first-child {
    opacity: 0;
}

.toggle-input:checked + .toggle-slider .toggle-text:last-child {
    opacity: 1;
}

.loading-toggle .toggle-slider {
    overflow: hidden;
}

.toggle-loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    width: 20px;
    height: 20px;
    border: 2px solid transparent;
    border-top: 2px solid white;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    opacity: 0;
    transition: all 0.3s ease;
}

.toggle-input:checked + .toggle-slider .toggle-loading {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}

@keyframes spin {
    0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    100% { transform: translate(-50%, -50%) scale(1) rotate(360deg); }
}

.status-panel {
    background: #e9ecef;
    padding: 25px;
    border-radius: 15px;
    margin-top: 30px;
}

.status-panel h3 {
    color: #495057;
    margin-bottom: 15px;
    font-size: 1.3em;
}

.status {
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 20px;
    background: #dc3545;
    color: white;
    transition: all 0.3s ease;
}

.status.active {
    background: #28a745;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

.toggle-input:checked + .toggle-slider {
    animation: pulse 0.3s ease;
}

.toggle-switch:hover .toggle-slider {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
}

@media (max-width: 600px) {
    .container {
        padding: 20px;
        margin: 10px;
    }
    
    h1 {
        font-size: 2em;
    }
    
    .toggle-section {
        padding: 15px;
    }
    
    .toggle-switch {
        width: 70px;
        height: 35px;
    }
    
    .toggle-slider:before {
        height: 28px;
        width: 28px;
    }
    
    .toggle-input:checked + .toggle-slider:before {
        transform: translateX(35px);
    }
    
    .text-toggle {
        width: 90px;
    }
}

.toggle-switch:active .toggle-slider:before {
    width: 36px;
}

.toggle-input:checked:active + .toggle-slider:before {
    transform: translateX(36px);
}</style></head><body><!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Анимированный переключатель</title>
	<link rel="stylesheet" href="toggle-style.css">
</head>

<body>
	<div class="container">
		<h1>Анимированные переключатели</h1>

		<div class="toggle-section">
			<h2>Простой переключатель</h2>
			<label class="toggle-switch">
                <input type="checkbox" class="toggle-input">
                <span class="toggle-slider"></span>
                <span class="toggle-labels">
                    <span class="toggle-off">Выкл</span>
                    <span class="toggle-on">Вкл</span>
                </span>
            </label>
		</div>

		<div class="toggle-section">
			<h2>Переключатель с иконками</h2>
			<label class="toggle-switch icon-toggle">
                <input type="checkbox" class="toggle-input">
                <span class="toggle-slider">
                    <span class="toggle-icon">🌙</span>
                    <span class="toggle-icon">☀️</span>
                </span>
            </label>
		</div>

		
		<div class="toggle-section">
			<h2>Переключатель с загрузкой</h2>
			<label class="toggle-switch loading-toggle">
                <input type="checkbox" class="toggle-input" id="loading-toggle">
                <span class="toggle-slider">
                    <span class="toggle-loading"></span>
                </span>
            </label>
		</div>

		<div class="status-panel">
			<h3>Статус переключателей:</h3>
			<div id="status-output">
				<p>Простой: <span class="status" id="status-simple">Выкл</span></p>
				<p>С иконками: <span class="status" id="status-icon">Выкл</span></p>
				<p>С загрузкой: <span class="status" id="status-loading">Выкл</span></p>
			</div>
		</div>
	</div>

	<script src="toggle-script.js"></script>
</body>

</html><script type="text/javascript">class ToggleSwitchManager {
  constructor() {
    this.toggles = [];
    this.initializeToggles();
    this.bindEvents();
  }

  initializeToggles() {
    this.toggles = document.querySelectorAll('.toggle-input');

    this.restoreStates();
  }
  bindEvents() {
    this.toggles.forEach((toggle, index) => {
      toggle.addEventListener('change', (e) => {
        this.handleToggleChange(e.target, index);
      });

      toggle.addEventListener('click', (e) => {
        this.animateToggle(e.target);
      });
    });
    const loadingToggle = document.getElementById('loading-toggle');
    if (loadingToggle) {
      loadingToggle.addEventListener('change', (e) => {
        this.handleLoadingToggle(e.target);
      });
    }
  }
  handleToggleChange(toggle, index) {
    const isChecked = toggle.checked;
    const statusElement = document.getElementById(`status-${this.getToggleType(index)}`);

    if (statusElement) {
      statusElement.textContent = isChecked ? 'Вкл' : 'Выкл';
      statusElement.classList.toggle('active', isChecked);
    }
    this.saveState(index, isChecked);
    this.showFeedback(isChecked);
  }

  handleLoadingToggle(toggle) {
    const isChecked = toggle.checked;
    const statusElement = document.getElementById('status-loading');

    if (statusElement) {
      statusElement.textContent = isChecked ? 'Загрузка...' : 'Выкл';
      statusElement.classList.toggle('active', isChecked);
    }
    if (isChecked) {
      setTimeout(() => {
        statusElement.textContent = 'Вкл';
        this.saveState(3, true);
      }, 2000);
    } else {
      this.saveState(3, false);
    }
  }

  animateToggle(toggle) {
    const slider = toggle.nextElementSibling;
    if (!slider) return;

    slider.style.transform = 'scale(0.95)';
    setTimeout(() => {
      slider.style.transform = '';
    }, 150);
  }

  getToggleType(index) {
    const types = ['simple', 'icon', 'text', 'loading'];
    return types[index] || 'unknown';
  }

  saveState(index, state) {
    localStorage.setItem(`toggle_${index}`, state);
  }

  restoreStates() {
    this.toggles.forEach((toggle, index) => {
      const savedState = localStorage.getItem(`toggle_${index}`);
      if (savedState !== null) {
        const isChecked = savedState === 'true';
        toggle.checked = isChecked;

        const statusElement = document.getElementById(`status-${this.getToggleType(index)}`);
        if (statusElement) {
          statusElement.textContent = isChecked ? 'Вкл' : 'Выкл';
          statusElement.classList.toggle('active', isChecked);
        }

        const event = new Event('change');
        toggle.dispatchEvent(event);
      }
    });
  }

  showFeedback(isChecked) {
    this.createParticles(isChecked);

    this.playSound(isChecked);
  }

  createParticles(isChecked) {
    const particles = document.createElement('div');
    particles.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        `;
    document.body.appendChild(particles);

    for (let i = 0; i < 10; i++) {
      const particle = document.createElement('div');
      particle.style.cssText = `
                position: absolute;
                width: 6px;
                height: 6px;
                background: ${isChecked ? '#28a745' : '#dc3545'};
                border-radius: 50%;
                pointer-events: none;
            `;
      particles.appendChild(particle);

      const animation = particle.animate([
        {
          transform: 'translate(0, 0) scale(1)',
          opacity: 1
        },
        {
          transform: `translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px) scale(0)`,
          opacity: 0
        }
      ], {
        duration: 1000,
        easing: 'ease-out'
      });

      animation.onfinish = () => {
        particle.remove();
        if (particles.children.length === 0) {
          particles.remove();
        }
      };
    }
  }

  playSound(isChecked) {
    try {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(isChecked ? 800 : 400, audioContext.currentTime);
      gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.2);

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.start();
      oscillator.stop(audioContext.currentTime + 0.2);
    } catch (error) {
      console.log('Web Audio API не поддерживается');
    }
  }

  toggleSwitch(index) {
    if (this.toggles[index]) {
      this.toggles[index].checked = !this.toggles[index].checked;
      const event = new Event('change');
      this.toggles[index].dispatchEvent(event);
    }
  }

  getSwitchState(index) {
    return this.toggles[index] ? this.toggles[index].checked : null;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const toggleManager = new ToggleSwitchManager();

  window.toggleManager = toggleManager;

  console.log('Менеджер переключателей инициализирован!');
  console.log('Используйте toggleManager.toggleSwitch(index) для программного переключения');
  console.log('Используйте toggleManager.getSwitchState(index) для получения состояния');
});


function simulateNetworkRequest(toggleIndex) {
  const toggle = document.querySelectorAll('.toggle-input')[toggleIndex];
  if (toggle) {
    toggle.disabled = true;

    setTimeout(() => {
      toggle.checked = !toggle.checked;
      const event = new Event('change');
      toggle.dispatchEvent(event);
      toggle.disabled = false;
    }, 1500);
  }
}</script></body><html>
