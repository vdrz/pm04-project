<!doctype html><html><head></head><body><!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Подключение к принтеру</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: 'Segoe UI', Arial, sans-serif;
		}

		body {
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			padding: 20px;
		}

		.printer-interface {
			background: white;
			border-radius: 20px;
			box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
			padding: 40px;
			width: 100%;
			max-width: 500px;
		}

		.header {
			text-align: center;
			margin-bottom: 30px;
		}

		.printer-image {
			font-size: 80px;
			margin-bottom: 15px;
			display: block;
		}

		.title {
			font-size: 28px;
			font-weight: bold;
			color: #2c3e50;
			margin-bottom: 10px;
		}

		.subtitle {
			font-size: 16px;
			color: #666;
			line-height: 1.5;
		}

		.status-section {
			background: #f8f9fa;
			border-radius: 15px;
			padding: 20px;
			margin-bottom: 25px;
		}

		.section-title {
			font-size: 18px;
			font-weight: bold;
			color: #2c3e50;
			margin-bottom: 15px;
			display: flex;
			align-items: center;
		}

		.section-title::before {
			content: "●";
			color: #4caf50;
			margin-right: 10px;
			font-size: 14px;
		}

		.status-item {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 12px 0;
			border-bottom: 1px solid #e9ecef;
		}

		.status-item:last-child {
			border-bottom: none;
		}

		.status-label {
			font-size: 14px;
			color: #666;
		}

		.status-value {
			font-size: 14px;
			font-weight: bold;
			color: #2c3e50;
		}

		.connection-section {
			background: #f8f9fa;
			border-radius: 15px;
			padding: 20px;
			margin-bottom: 25px;
		}

		.connection-options {
			display: flex;
			flex-direction: column;
			gap: 12px;
		}

		.connection-option {
			display: flex;
			align-items: center;
			padding: 15px;
			background: white;
			border: 2px solid #e9ecef;
			border-radius: 10px;
			cursor: pointer;
			transition: all 0.3s ease;
		}

		.connection-option:hover {
			border-color: #667eea;
			background: #f8f9ff;
		}

		.connection-option.selected {
			border-color: #4caf50;
			background: #f0f9f0;
		}

		.option-icon {
			font-size: 20px;
			margin-right: 15px;
			width: 24px;
			text-align: center;
		}

		.option-text {
			font-size: 16px;
			color: #2c3e50;
			font-weight: 500;
		}

		.buttons-section {
			display: flex;
			gap: 15px;
			margin-bottom: 20px;
		}

		.btn {
			flex: 1;
			padding: 15px;
			border: none;
			border-radius: 10px;
			font-size: 16px;
			font-weight: bold;
			cursor: pointer;
			transition: all 0.3s ease;
		}

		.btn-connect {
			background: linear-gradient(135deg, #4caf50, #45a049);
			color: white;
		}

		.btn-reset {
			background: #f8f9fa;
			color: #666;
			border: 2px solid #e9ecef;
		}

		.btn:hover {
			transform: translateY(-2px);
			box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
		}

		.btn:active {
			transform: translateY(0);
		}

		.success-message {
			background: linear-gradient(135deg, #4caf50, #45a049);
			color: white;
			padding: 15px;
			border-radius: 10px;
			text-align: center;
			font-weight: bold;
			display: none;
			animation: slideIn 0.5s ease;
		}

		@keyframes slideIn {
			from {
				opacity: 0;
				transform: translateY(-20px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		@media (max-width: 480px) {
			.printer-interface {
				padding: 25px;
			}

			.printer-image {
				font-size: 60px;
			}

			.title {
				font-size: 24px;
			}

			.buttons-section {
				flex-direction: column;
			}
		}
	</style>
</head>

<body>
	<div class="printer-interface">
		<div class="header">
			<div class="printer-image">🖨️</div>
			<h1 class="title">Подключение к принтеру</h1>
			<p class="subtitle">Выберите способ подключения и управляйте устройством</p>
		</div>

		<div class="status-section">
			<div class="section-title">Состояние принтера</div>
			<div class="status-item">
				<span class="status-label">Потребление чернил</span>
				<span class="status-value">65%</span>
			</div>
			<div class="status-item">
				<span class="status-label">Загрузка бумаги</span>
				<span class="status-value">85%</span>
			</div>
			<div class="status-item">
				<span class="status-label">Статус</span>
				<span class="status-value">Готов к работе</span>
			</div>
		</div>

		<div class="connection-section">
			<div class="section-title">Способы подключения</div>
			<div class="connection-options">
				<div class="connection-option" data-option="wifi">
					<div class="option-icon">📶</div>
					<div class="option-text">Wi-Fi</div>
				</div>

				<div class="connection-option" data-option="network">
					<div class="option-icon">🌐</div>
					<div class="option-text">Сеть</div>
				</div>

				<div class="connection-option" data-option="usb">
					<div class="option-icon">🔌</div>
					<div class="option-text">USB</div>
				</div>
			</div>
		</div>

		<div class="buttons-section">
			<button class="btn btn-connect" id="connectBtn">Подключить через Wi-Fi</button>
			<button class="btn btn-reset" id="resetBtn">Сброс</button>
		</div>

		<div class="success-message" id="successMessage">
			Успешно подключено через Wi-Fi
		</div>
	</div>

	<script>
		// Выбор способа подключения
        const connectionOptions = document.querySelectorAll('.connection-option');
        const connectBtn = document.getElementById('connectBtn');
        const resetBtn = document.getElementById('resetBtn');
        const successMessage = document.getElementById('successMessage');
        
        let selectedOption = 'wifi';
        
        connectionOptions.forEach(option => {
            option.addEventListener('click', function() {
                // Снимаем выделение со всех вариантов
                connectionOptions.forEach(opt => opt.classList.remove('selected'));
                
                // Выделяем выбранный вариант
                this.classList.add('selected');
                selectedOption = this.getAttribute('data-option');
                
                // Обновляем текст кнопки подключения
                updateConnectButton();
            });
        });
        
        function updateConnectButton() {
            const optionNames = {
                'wifi': 'Wi-Fi',
                'network': 'Сеть',
                'usb': 'USB'
            };
            connectBtn.textContent = `Подключить через ${optionNames[selectedOption]}`;
        }
        
        // Обработка подключения
        connectBtn.addEventListener('click', function() {
            // Показываем анимацию подключения
            const originalText = connectBtn.textContent;
            connectBtn.textContent = 'Подключение...';
            connectBtn.disabled = true;
            
            // Имитация процесса подключения
            setTimeout(() => {
                const optionNames = {
                    'wifi': 'Wi-Fi',
                    'network': 'сеть',
                    'usb': 'USB'
                };
                
                successMessage.textContent = `Успешно подключено через ${optionNames[selectedOption]}`;
                successMessage.style.display = 'block';
                
                // Восстанавливаем кнопку
                setTimeout(() => {
                    connectBtn.textContent = originalText;
                    connectBtn.disabled = false;
                }, 2000);
            }, 1500);
        });
        
        // Обработка сброса
        resetBtn.addEventListener('click', function() {
            // Сбрасываем выделение
            connectionOptions.forEach(opt => opt.classList.remove('selected'));
            
            // Выбираем вариант по умолчанию
            document.querySelector('[data-option="wifi"]').classList.add('selected');
            selectedOption = 'wifi';
            
            // Скрываем сообщение об успехе
            successMessage.style.display = 'none';
            
            // Обновляем кнопку
            updateConnectButton();
        });
        
        // Инициализация - выбираем Wi-Fi по умолчанию
        document.querySelector('[data-option="wifi"]').classList.add('selected');
	</script>
</body>

</html></body><html>
