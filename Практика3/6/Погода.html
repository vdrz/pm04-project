<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода сейчас</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .search-box {
            display: flex;
            margin-bottom: 30px;
        }
        
        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 10px 0 0 10px;
            background: #f0f0f0;
            font-size: 16px;
            outline: none;
        }
        
        .search-box button {
            padding: 12px 20px;
            border: none;
            border-radius: 0 10px 10px 0;
            background: #6e8efb;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        
        .search-box button:hover {
            background: #5a7dfa;
        }
        
        .weather-info {
            display: none;
        }
        
        .city-name {
            font-size: 28px;
            margin-bottom: 10px;
            color: #333;
        }
        
        .date {
            color: #666;
            margin-bottom: 20px;
        }
        
        .temperature {
            font-size: 64px;
            font-weight: 700;
            margin: 20px 0;
            color: #333;
        }
        
        .weather-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto;
        }
        
        .weather-description {
            font-size: 22px;
            margin-bottom: 20px;
            text-transform: capitalize;
        }
        
        .details {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .detail-item {
            flex: 1;
        }
        
        .detail-label {
            font-size: 14px;
            color: #666;
        }
        
        .detail-value {
            font-size: 18px;
            font-weight: 600;
            margin-top: 5px;
        }
        
        .error-message {
            color: #e74c3c;
            margin-top: 10px;
            display: none;
        }
        
        .loading {
            display: none;
            margin: 20px 0;
        }
        
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #6e8efb;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Погода сейчас</h1>
        
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Введите название города">
            <button id="search-btn">Поиск</button>
        </div>
        
        <div class="error-message" id="error-message"></div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>
        
        <div class="weather-info" id="weather-info">
            <h2 class="city-name" id="city-name">Москва</h2>
            <p class="date" id="date">Понедельник, 1 января</p>
            
            <div class="weather-icon">
                <img id="weather-icon" src="" alt="Погода">
            </div>
            
            <div class="temperature" id="temperature">20°C</div>
            <p class="weather-description" id="weather-description">Солнечно</p>
            
            <div class="details">
                <div class="detail-item">
                    <div class="detail-label">Влажность</div>
                    <div class="detail-value" id="humidity">60%</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Ветер</div>
                    <div class="detail-value" id="wind-speed">5 м/с</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Давление</div>
                    <div class="detail-value" id="pressure">1013 гПа</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Элементы DOM
        const cityInput = document.getElementById('city-input');
        const searchBtn = document.getElementById('search-btn');
        const errorMessage = document.getElementById('error-message');
        const loading = document.getElementById('loading');
        const weatherInfo = document.getElementById('weather-info');
        
        const cityName = document.getElementById('city-name');
        const dateElement = document.getElementById('date');
        const weatherIcon = document.getElementById('weather-icon');
        const temperature = document.getElementById('temperature');
        const weatherDescription = document.getElementById('weather-description');
        const humidity = document.getElementById('humidity');
        const windSpeed = document.getElementById('wind-speed');
        const pressure = document.getElementById('pressure');
        
        // Обновление даты
        function updateDate() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            dateElement.textContent = now.toLocaleDateString('ru-RU', options);
        }
        
        // Получение данных о погоде
        async function getWeatherData(city) {
            // В реальном проекте здесь должен быть API ключ и запрос к сервису погоды
            // Для демонстрации используем имитацию данных
            
            // Имитация загрузки
            loading.style.display = 'block';
            weatherInfo.style.display = 'none';
            errorMessage.style.display = 'none';
            
            // Имитация задержки API
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Имитация ответа API с случайными данными
            const weatherData = {
                name: city,
                main: {
                    temp: Math.round(Math.random() * 40 - 10), // от -10 до 30
                    humidity: Math.round(Math.random() * 100),
                    pressure: Math.round(980 + Math.random() * 60)
                },
                weather: [
                    {
                        main: ['Ясно', 'Облачно', 'Дождь', 'Снег'][Math.floor(Math.random() * 4)],
                        description: ['ясно', 'облачно', 'небольшой дождь', 'снег'][Math.floor(Math.random() * 4)],
                        icon: '01d' // В реальном проекте здесь будет код иконки
                    }
                ],
                wind: {
                    speed: Math.round(Math.random() * 15)
                }
            };
            
            // В реальном проекте здесь будет обработка ошибок API
            if (!city || city.trim() === '') {
                throw new Error('Введите название города');
            }
            
            return weatherData;
        }
        
        // Отображение данных о погоде
        function displayWeatherData(data) {
            cityName.textContent = data.name;
            temperature.textContent = `${data.main.temp}°C`;
            weatherDescription.textContent = data.weather[0].description;
            humidity.textContent = `${data.main.humidity}%`;
            windSpeed.textContent = `${data.wind.speed} м/с`;
            pressure.textContent = `${data.main.pressure} гПа`;
            
            // В реальном проекте здесь будет установка правильной иконки
            weatherIcon.src = `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;
            weatherIcon.alt = data.weather[0].description;
            
            loading.style.display = 'none';
            weatherInfo.style.display = 'block';
        }
        
        // Обработка ошибок
        function displayError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            loading.style.display = 'none';
            weatherInfo.style.display = 'none';
        }
        
        // Обработчик поиска
        async function handleSearch() {
            const city = cityInput.value.trim();
            
            try {
                const weatherData = await getWeatherData(city);
                displayWeatherData(weatherData);
            } catch (error) {
                displayError(error.message);
            }
        }
        
        // Инициализация
        function init() {
            updateDate();
            
            // Обработчики событий
            searchBtn.addEventListener('click', handleSearch);
            cityInput.addEventListener('keyup', (event) => {
                if (event.key === 'Enter') {
                    handleSearch();
                }
            });
            
            // Загружаем погоду для Москвы по умолчанию
            handleSearch();
        }
        
        // Запуск приложения
        init();
    </script>
</body>
</html>
